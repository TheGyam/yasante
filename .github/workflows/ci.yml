name: CI

on:
  # Pushes to master only (a pull request is checked by its own run below, so a
  # branch isn't checked twice).
  push:
    branches: [master]
  pull_request:
  # The deploy workflow runs this first and only ships what passes.
  workflow_call:

concurrency:
  # Per workflow: CI run inside a deploy mustn't cancel, or be cancelled by, plain CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest --ci
      - name: API types match openapi.yaml
        run: npm run api:types && git diff --exit-code src/shared/lib/api/schema.d.ts

  web:
    name: Website (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: API types match openapi.yaml
        run: npm run api:types && git diff --exit-code src/shared/lib/api/schema.d.ts
      - run: npx vite build

  backend:
    name: Backend (tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://yasante:yasante@localhost:5432/yasante
    steps:
      - uses: actions/checkout@v5
      # The runner comes with PostgreSQL installed, so nothing is downloaded: both Docker Hub
      # and AWS's mirror rate-limit the image pulls of shared CI runners.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER yasante WITH PASSWORD 'yasante' SUPERUSER" -c "CREATE DATABASE yasante OWNER yasante"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: python -m pytest -q -p no:cacheprovider --create-db
      - name: openapi.yaml matches the API (regenerate with manage.py spectacular)
        run: python manage.py spectacular --file ../openapi.yaml && git diff --exit-code ../openapi.yaml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
