openapi: 3.0.3
info:
  title: Yasante API
  version: 1.0.0
  description: Backend APIs for Yasante.
paths:
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: |-
        POST /api/auth/forgot-password/

        Always returns 200 whether the email exists or not (timing-safe).
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/auth/login/
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/auth/logout/ — { refreshToken } ends this device's session.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout-all/:
