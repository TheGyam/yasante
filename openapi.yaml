components:
  schemas:
    AcceptRequestRequest:
      type: object
      properties:
        scheduledFor:
          type: string
          format: date-time
        deposit:
          $ref: '#/components/schemas/MoneyMethodRequest'
      required:
      - scheduledFor
    ActionEnum:
      enum:
      - hide
      - remove
      - unpublish
      type: string
      description: |-
        * `hide` - hide
        * `remove` - remove
        * `unpublish` - unpublish
    AgainEnum:
      enum:
      - 'yes'
      - maybe
      - 'no'
      type: string
      description: |-
        * `yes` - yes
        * `maybe` - maybe
        * `no` - no
    AnswerRequestRequest:
      type: object
      properties:
        accept:
          type: boolean
        reason:
          type: string
          minLength: 1
      required:
      - accept
    AppealRequestRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - body
    AppealResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
      required:
      - id
      - status
    AppealState:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AppealStateStatusEnum'
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - status
    AppealStateStatusEnum:
      enum:
      - open
      - upheld
      - overturned
      type: string
      description: |-
        * `open` - open
        * `upheld` - upheld
        * `overturned` - overturned
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: integer
          description: Milliseconds since the epoch
      required:
      - accessToken
      - expiresAt
      - refreshToken
      - user
    Availability:
      type: object
      properties:
        week:
          type: array
          items:
            type: object
            nullable: true
            properties:
              start:
                type: string
              end:
                type: string
            required:
            - start
            - end
          minItems: 7
          maxItems: 7
        blocked:
          type: array
          items:
            type: string
            format: date
      required:
      - blocked
      - week
    BarcodeResult:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ProductResponse'
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - product
      - source
    BlankEnum:
      enum:
      - ''
    Block:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - accountId
      - createdAt
      - id
      - name
    BlockRequestRequest:
      type: object
      properties:
        accountId:
          type: string
          minLength: 1
      required:
      - accountId
    Booking:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        clientId:
          type: string
        clientName:
          type: string
        clientHair:
          type: string
        clientRecord:
          allOf:
          - $ref: '#/components/schemas/ClientRecord'
        stylistId:
          type: string
        stylistName:
          type: string
        stylistHandle:
          type: string
        serviceId:
          type: string
        serviceName:
          type: string
        styles:
          type: array
          items:
            type: string
          description: Style slugs
        fromLook:
          allOf:
          - $ref: '#/components/schemas/FromLook'
        optionLabels:
          type: array
          items:
            type: string
        price:
          type: number
          format: double
        fromPrice:
          type: boolean
        durationMinutes:
          type: integer
        bringingOwnHair:
          type: boolean
        hairIncluded:
          type: boolean
        notes:
          type: string
        calendarUrl:
          type: string
        requestedTimes:
          type: array
          items:
            type: string
            format: date-time
        scheduledFor:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        proposal:
          allOf:
          - $ref: '#/components/schemas/Proposal'
        attendanceConfirmedAt:
          type: string
          format: date-time
        moves:
          type: integer
        moveRequest:
          allOf:
          - $ref: '#/components/schemas/MoveRequest'
        deposit:
          allOf:
          - $ref: '#/components/schemas/Deposit'
        area:
          type: string
        atClient:
          type: boolean
          description: The stylist travels to the client
        address:
          type: string
        policy:
          $ref: '#/components/schemas/BookingPolicy'
        policyVersion:
          type: string
        reason:
          type: string
        completedAt:
          type: string
          format: date-time
        actualPrice:
          type: number
          format: double
        timing:
          allOf:
          - $ref: '#/components/schemas/Timing'
        startedOnTime:
          type: boolean
        contested:
          allOf:
          - $ref: '#/components/schemas/Contested'
        review:
          allOf:
          - $ref: '#/components/schemas/ReviewState'
        checkInDue:
          $ref: '#/components/schemas/CheckInDueEnum'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - area
      - atClient
      - bringingOwnHair
      - clientName
      - createdAt
      - fromPrice
      - id
      - moves
      - policy
      - policyVersion
      - price
      - requestedTimes
      - serviceId
      - serviceName
      - status
      - styles
      - stylistName
      - updatedAt
    BookingCreateRequestRequest:
      type: object
      properties:
        stylistId:
          type: string
          minLength: 1
        serviceId:
          type: string
          minLength: 1
        options:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: Chosen option id by group id
        bringingOwnHair:
          type: boolean
        requestedTimes:
          type: array
          items:
            type: string
            format: date-time
        notes:
          type: string
          minLength: 1
        policyVersion:
          type: string
          minLength: 1
        lookId:
          type: string
          minLength: 1
          description: The look the booking is from
        atClient:
          type: boolean
          description: The stylist comes to the client
        clientAddress:
          type: string
          minLength: 1
          description: Street and postcode, when at_client
      required:
      - bringingOwnHair
      - policyVersion
      - requestedTimes
      - serviceId
      - stylistId
    BookingPolicy:
      type: object
      description: Her policies as they were when the request was made.
      properties:
        noticeHours:
          type: integer
        depositType:
          $ref: '#/components/schemas/DepositTypeEnum'
        depositAmount:
          type: number
          format: double
        rescheduleFreeOnce:
          type: boolean
      required:
      - depositType
      - noticeHours
      - rescheduleFreeOnce
    BookingStatusEnum:
      enum:
      - requested
      - awaiting_deposit
      - confirmed
      - completed
      - declined
      - expired
      - cancelled_in_time
      - cancelled_late
      - cancelled_by_stylist
      - no_show
      type: string
      description: |-
        * `requested` - requested
        * `awaiting_deposit` - awaiting_deposit
        * `confirmed` - confirmed
        * `completed` - completed
        * `declined` - declined
        * `expired` - expired
        * `cancelled_in_time` - cancelled_in_time
        * `cancelled_late` - cancelled_late
        * `cancelled_by_stylist` - cancelled_by_stylist
        * `no_show` - no_show
    BucketEnum:
      enum:
      - under_30
      - '30_60'
      - 1_2h
      - 2h_plus
      type: string
      description: |-
        * `under_30` - under_30
        * `30_60` - 30_60
        * `1_2h` - 1_2h
        * `2h_plus` - 2h_plus
    BudgetEnum:
      enum:
      - under_50
      - '50_100'
      - '100_150'
      - 150_plus
      type: string
      description: |-
        * `under_50` - Under £50
        * `50_100` - £50–100
        * `100_150` - £100–150
        * `150_plus` - £150+
    ByEnum:
      enum:
      - client
      - stylist
      type: string
      description: |-
        * `client` - client
        * `stylist` - stylist
    CarePlanRequestRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        specificDays:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDayEnum'
        remindersOn:
          type: boolean
        steps:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - frequency
      - name
      - timeOfDay
    CarePlanResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        specificDays:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDayEnum'
        remindersOn:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CarePlanStepResponse'
        lastDoneAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - frequency
      - id
      - name
      - remindersOn
      - steps
      - timeOfDay
    CarePlanSessionRequestRequest:
      type: object
      properties:
        notes:
          type: string
          minLength: 1
        localAt:
          type: string
          minLength: 1
          description: The phone's own clock
    CarePlanSessionResponse:
      type: object
      properties:
        id:
          type: string
        completedAt:
          type: string
          format: date-time
        notes:
          type: string
      required:
      - completedAt
      - id
    CarePlanStepResponse:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
      required:
      - id
      - text
    CategoryEnum:
      enum:
      - shampoo
      - conditioner
      - leave-in
      - oil
      - styler
