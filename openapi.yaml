components:
  schemas:
    ActionEnum:
      enum:
      - hide
      - remove
      - unpublish
      type: string
      description: |-
        * `hide` - hide
        * `remove` - remove
        * `unpublish` - unpublish
    AppealRequestRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - body
    AppealResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
      required:
      - id
      - status
    AppealState:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AppealStateStatusEnum'
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - status
    AppealStateStatusEnum:
      enum:
      - open
      - upheld
      - overturned
      type: string
      description: |-
        * `open` - open
        * `upheld` - upheld
        * `overturned` - overturned
    DeviceToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          maxLength: 500
        platform:
          type: string
          maxLength: 20
      required:
      - id
      - platform
      - token
    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 500
        platform:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - platform
      - token
    MyModeration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ActionEnum'
        reason:
          type: string
        target:
          type: string
          description: look, lookcomment, stylistprofile or review
        targetId:
          type: string
        createdAt:
          type: string
          format: date-time
        appeal:
          allOf:
          - $ref: '#/components/schemas/AppealState'
          nullable: true
      required:
      - action
      - createdAt
      - id
      - reason
      - target
      - targetId
    MyReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        target:
          type: string
          description: look, lookcomment, stylistprofile or review
        reason:
          type: string
        status:
          $ref: '#/components/schemas/MyReportStatusEnum'
        resolution:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        handledAt:
          type: string
          format: date-time
          nullable: true
      required:
      - createdAt
      - id
      - reason
      - status
      - target
    MyReportStatusEnum:
      enum:
      - open
      - actioned
      - dismissed
      type: string
      description: |-
        * `open` - open
        * `actioned` - actioned
        * `dismissed` - dismissed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
