openapi: 3.0.3
info:
  title: Yasante API
  version: 1.0.0
  description: Backend APIs for Yasante.
paths:
  /api/auth/email/start/:
    post:
      operationId: auth_email_start_create
      description: |-
        POST /api/auth/email/start/

        Emails a six-digit code to her address, or to a corrected one she sends (which
        becomes her address, unverified, if nobody else has it). One code every 30s.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailStartRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
  /api/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: POST /api/auth/email/verify/ — five tries per code.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: |-
        POST /api/auth/forgot-password/

        Always returns 200 whether the email exists or not (timing-safe).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/auth/login/
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/auth/logout/ — { refreshToken } ends this device's session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: POST /api/auth/logout-all/ — every device signs out, this one included.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/refresh-token/:
    post:
      operationId: auth_refresh_token_create
      description: |-
        POST /api/auth/refresh-token/

        Rotates the refresh token and blacklists the old one.
      tags:
      - auth
      requestBody:
