      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/social/:
    post:
      operationId: auth_social_create
      description: |-
        POST /api/auth/social/ — Sign in with Apple or Google, which also signs up.

        Finds the account by the provider's id, then by a verified email (linking the
        two), and otherwise makes a new one. Apple and Google have already proved the
        email, so it starts confirmed and never needs a password.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthResponse'
          description: ''
  /api/blocks/:
    get:
      operationId: blocks_list
      description: GET / POST /api/blocks/ — { accountId }. Mutual from that moment.
      tags:
      - blocks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
          description: ''
    post:
      operationId: blocks_create
      description: GET / POST /api/blocks/ — { accountId }. Mutual from that moment.
      tags:
