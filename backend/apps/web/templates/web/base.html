<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Yasante{% endblock %}</title>
<meta name="description" content="{% block description %}Find a braider whose work you’ve seen on hair like yours, and book them.{% endblock %}">
<meta property="og:site_name" content="Yasante">
<meta property="og:title" content="{% block og_title %}Yasante{% endblock %}">
<meta property="og:description" content="{% block og_description %}Find a braider whose work you’ve seen on hair like yours, and book them.{% endblock %}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
{% block og_image %}{% endblock %}
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{ request.build_absolute_uri }}">
<style>
:root{--bg:#F7F2F4;--card:#fff;--text:#1B0E14;--muted:rgba(27,14,20,.62);--line:rgba(27,14,20,.08);--accent:#B8336A;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0B0709;--card:#170f13;--text:#F8F1F4;--muted:rgba(248,241,244,.66);--line:rgba(255,255,255,.09);--accent:#FF8FB8;--on:#1C0912}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
a{color:var(--accent)}h1{font-size:28px;line-height:1.2;margin:0 0 4px}h2{font-size:18px;margin:32px 0 12px}
.brand{font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--text);font-size:20px}
.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-block;background:var(--accent);color:var(--on);border:0;border-radius:999px;padding:12px 22px;font:600 16px/1 inherit;text-decoration:none;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:6px 0 12px}
footer{margin-top:48px;font-size:14px}footer a{color:var(--muted);margin-right:16px}
</style>
</head>
<body>
<main>
<a class="brand" href="/">yasante</a>
{% block content %}{% endblock %}
<footer class="muted"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/guidelines">Guidelines</a></footer>
</main>
</body>
</html>
